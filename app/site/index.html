<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Security Headers via meta tags -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com https://*.amazonaws.com wss://*.amazonaws.com https://*.bedrock-agentcore.*.amazonaws.com https://cognito-identity.*.amazonaws.com https://cognito-idp.*.amazonaws.com ;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Financial Planning Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components/chatbot.css">
    <link rel="stylesheet" href="components/tool-use.css">
    <link rel="stylesheet" href="components/markdown.css">
    <link rel="stylesheet" href="components/stream-animation.css">
    <link rel="stylesheet" href="components/skeleton.css">
    <link rel="stylesheet" href="components/robot-loader.css">
    <link rel="stylesheet" href="components/robot-tool-animation.css">
    <link rel="stylesheet" href="components/orchestrator.css">
    <link rel="stylesheet" href="components/chatbot/worker-settings.css">
    <link rel="stylesheet" href="components/chatbot/token-audit-panel.css">
    <link rel="stylesheet" href="components/conversations.css">
    <!-- Tab Bar & Workflow Builder -->
    <link rel="stylesheet" href="components/tab-bar.css">
    <link rel="stylesheet" href="components/workflow-builder/workflow-builder.css">
</head>
<body>
    <!-- Simple loading indicator -->
    <div id="robot-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;background:var(--light-bg,#f9f9f9);font-family:-apple-system,BlinkMacSystemFont,sans-serif;">
        <div style="text-align:center;">
            <div style="font-size:14px;color:#808080;">Loading...</div>
        </div>
    </div>

    <!-- Unauthorized Screen - This is the ONLY content that exists for unauthenticated users -->
    <div id="unauthorized-screen" class="unauthorized-screen hidden">
        <div class="unauthorized-content">
            <div class="unauthorized-icon">🔒</div>
            <h1>Unauthorized</h1>
            <p>You must be authenticated to access this application.</p>
            <button id="loginBtn" class="btn btn-primary btn-lg" style="margin-top: 1.5rem; padding: 0.75rem 2rem; font-size: 1.1rem; cursor: pointer;">
                🔐 Sign In
            </button>
        </div>
    </div>

    <!-- App container - content injected only after authentication -->
    <div id="app-root"></div>

    <!-- Config placeholders for variable injection (will be replaced at deploy time) -->
    <script>
        // These placeholders will be replaced by the variable injector Lambda at CloudFront edge
        // When running locally, dev-config.js provides fallback values via window.DEV_CONFIG
        window.RAW_CONFIG = {
            cognitoIdpId: "##_COG_IDP_ID_##",
            cognitoBaseUrl: "##_COG_BASE_URL_##",
            cognitoClientId: "##_COG_CLIENT_ID_##",
            cognitoUserPoolId: "##_COGNITO_USER_POOL_ID_##",
            stage: "##_STAGE_##",
            baseDomain: "##_BASE_DOMAIN_##",
            awsRegion: "##_AWS_REGION_##",
            apiBaseUrl: "##_API_BASE_URL_##",
            tokenExchangeEndpoint: "##_TOKEN_EXCHANGE_ENDPOINT_##",
            workflowWsUrl: "##_WORKFLOW_WS_URL_##",
            runtimeWsUrl: "##_RUNTIME_STREAM_WS_URL_##",
            runtimeEndpoint: "##_RUNTIME_ENDPOINT_##",
            runtimeArn: "##_RUNTIME_ARN_##"
        };
    </script>
    
    <!-- Public runtime config generated by the frontend container. -->
    <script src="runtime-config.js"></script>
    
    <!-- Config resolver (merges injected config with dev defaults) - runs SYNCHRONOUSLY -->
    <script>
        (function() {
            // Check if a value is still a placeholder (starts with ##_ and ends with _##)
            function isPlaceholder(value) {
                return typeof value === 'string' && value.startsWith('##_') && value.endsWith('_##');
            }
            
            // Resolve config immediately (dev-config.js has already loaded synchronously above)
            var rawConfig = window.RAW_CONFIG || {};
            var devDefaults = window.DEV_CONFIG || {};
            var finalConfig = {};
            
            for (var key in rawConfig) {
                if (rawConfig.hasOwnProperty(key)) {
                    if (isPlaceholder(rawConfig[key])) {
                        // Placeholder not replaced - use dev default if available
                        finalConfig[key] = devDefaults[key] || rawConfig[key];
                    } else {
                        // Injected value - use it
                        finalConfig[key] = rawConfig[key];
                    }
                }
            }
            
            // Add a flag to indicate if we're using dev defaults
            finalConfig.isLocalDev = !!devDefaults.stage && isPlaceholder(rawConfig.stage);
            
            window.APP_CONFIG = finalConfig;
            
            // Log config status in dev mode
            if (finalConfig.isLocalDev) {
                console.info('[Financial Planning Assistant] Running in local development mode with dev defaults');
            }
        })();
    </script>
    <!-- Utilities (load first - no dependencies) -->
    <script src="utils/security.js"></script>
    <script src="utils/markdown.js"></script>
    <script src="utils/skeleton-loader.js"></script>
    
    <!-- Services (load in dependency order) -->
    <script src="services/bedrock-service.js?v=backend-runtime-only-20260503"></script>
    <script src="services/auth-service.js"></script>
    <script src="services/gateway-service.js"></script>
    <script src="services/mcp-service.js"></script>
    <script src="services/chat-service.js"></script>
    <script src="services/orchestrator-service.js"></script>
    <script src="services/conversation-service.js"></script>
    <script src="services/workflow-socket.js"></script>
    <script src="services/runtime-service.js?v=backend-runtime-only-20260503"></script>
    
    <!-- Components -->
    <script src="components/robot-tool-animation.js"></script>
    
    <!-- Chatbot Component (modular - load in dependency order) -->
    <script src="components/chatbot/security-utils.js"></script>
    <script src="components/chatbot/message-renderer.js"></script>
    <script src="components/chatbot/tool-executor.js"></script>
    <script src="components/chatbot/stream-animation.js"></script>
    <script src="components/chatbot/worker-panel.js"></script>
    <script src="components/chatbot/multi-worker-panel.js"></script>
    <script src="components/chatbot/orchestrator-ui.js"></script>
    <script src="components/chatbot/panels-manager.js"></script>
    <script src="components/chatbot/gateway-manager.js"></script>
    <script src="components/chatbot/worker-settings.js"></script>
    <script src="components/chatbot/token-audit-panel.js"></script>
    <script src="components/chatbot/chatbot.js?v=backend-runtime-only-20260503"></script>
    
    <!-- Tab Bar -->
    <script src="components/tab-bar.js"></script>
    
    <!-- Workflow Builder (loaded after workflow-socket.js) -->
    <script src="components/workflow-builder/workflow-list.js"></script>
    <script src="components/workflow-builder/canvas.js"></script>
    <script src="components/workflow-builder/node-editor.js"></script>
    <script src="components/workflow-builder/toolbar.js"></script>
    <script src="components/workflow-builder/collaboration.js"></script>
    <script src="components/workflow-builder/execution-panel.js"></script>
    <script src="components/workflow-builder/index.js"></script>
    
    <!-- Main Application (orchestrator - load last) -->
    <script src="app.js"></script>
</body>
</html>
